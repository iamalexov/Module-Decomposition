<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Chat App</title>

  <link
    rel="stylesheet"
    href="./main.css"
  />

</head>

<body>

  <main class="chat-container">

    <h1 class="title">
      Simple Chat
    </h1>

    <ul class="messages">

    </ul>

    <form class="form">

      <input
        type="text"
        class="input"
        placeholder="Write a message..."
        autocomplete="off"
      />

      <button class="btn">
        Send
      </button>

    </form>

  </main>

  <script src="./main.js"></script>

</body>
</html>
